name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Every release reaches all installed players and skills, so only
      # tagged commits on master are released, and the skill must carry the
      # tag's version (player and skill share one version).
      - name: Check tag, skill version and release notes
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "tag is not on master"; exit 1; }
          skill=$(sed -n 's/^__version__ = "\(.*\)"\r\{0,1\}$/\1/p' skill/youtube_video_player/__init__.py)
          test "$skill" = "${{ steps.version.outputs.VERSION }}" || { echo "tag v${{ steps.version.outputs.VERSION }} but skill __version__ $skill"; exit 1; }
          test -f "release-notes/$GITHUB_REF_NAME.md" || { echo "missing release-notes/$GITHUB_REF_NAME.md"; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test skill
        shell: bash
        run: |
          pip install pytest
          python -m pytest -q skill/tests

      # Skill only, for skills on 1.0.0: their updater looks for this name.
      - name: Build skill-only zip
        shell: bash
        run: python skill/build_zip.py "youtube_video_player-$GITHUB_REF_NAME.zip"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/wingman_player.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -o artifacts

      # What users download and what the skill updates from: install.bat plus
      # the skill folder with the player in youtube_video_player/player/.
      # No MSI: everything lives in Wingman's custom_skills folder.
      - name: Build release zip
        shell: bash
        run: python skill/build_zip.py "Wingman-Player-$GITHUB_REF_NAME.zip" --player artifacts

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Wingman-Player-${{ github.ref_name }}.zip
            Wingman-Player-${{ github.ref_name }}.zip.sha256
            youtube_video_player-${{ github.ref_name }}.zip
            youtube_video_player-${{ github.ref_name }}.zip.sha256
          name: Wingman Player ${{ github.ref_name }}
          # The skill reads (and Wingman may speak) the start of this body.
          body_path: release-notes/${{ github.ref_name }}.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
